  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#05080a;overflow:hidden;}
  #viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05080a;}
  #stage{
    width:1600px;height:900px;position:relative;overflow:hidden;transform-origin:center center;
    background:radial-gradient(120% 90% at 50% 18%, #1c4d31 0%, #123823 46%, #0a2316 78%, #061710 100%);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  }

  /* faint arena lattice backdrop */
  #lattice{position:absolute;inset:0;opacity:.10;
    background-image:
      linear-gradient(90deg, rgba(255,255,255,.5) 2px, transparent 2px),
      linear-gradient(rgba(255,255,255,.5) 2px, transparent 2px);
    background-size:80px 80px;}
  #glow{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);
    width:1300px;height:760px;
    background:radial-gradient(50% 50% at 50% 50%, rgba(255,180,60,.42) 0%, rgba(255,120,40,.18) 38%, rgba(255,80,30,0) 70%);
    filter:blur(2px);pointer-events:none;}

  /* floor band */
  #floor{position:absolute;left:0;right:0;bottom:0;height:300px;
    background-image:url('sprites/grassland/floor.png');background-size:100px 100px;
    box-shadow:inset 0 40px 60px -20px rgba(0,0,0,.5);}
  #floor::before{content:'';position:absolute;left:0;right:0;top:0;height:120px;
    background:linear-gradient(to bottom, rgba(6,23,16,.85), rgba(6,23,16,0));}
  #wallrow{position:absolute;left:0;right:0;bottom:0;height:100px;display:flex;}
  #wallrow img{width:100px;height:100px;display:block;}

  /* title block */
  #title{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);text-align:center;width:100%;}
  .word{font-family:'Bungee',cursive;font-size:148px;line-height:.82;letter-spacing:0;white-space:nowrap;
    -webkit-text-stroke:7px #0c1a10;paint-order:stroke fill;
    text-shadow:0 9px 0 #08120b, 0 10px 0 #08120b, 0 14px 22px rgba(0,0,0,.55);}
  .blast{background:linear-gradient(180deg,#ffd24d 6%,#ff8a2a 55%,#f0531a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .zone{background:linear-gradient(180deg,#b8f08a 6%,#5fc24a 55%,#2f8a2e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #arena{font-family:'Bungee',cursive;font-size:52px;letter-spacing:.62em;color:#eaf4ff;margin-top:24px;margin-left:.62em;
    -webkit-text-stroke:4px #0c1a10;paint-order:stroke fill;text-shadow:0 5px 0 #08120b, 0 6px 14px rgba(0,0,0,.5);}

  /* characters on the floor */
  .sprite{position:absolute;bottom:120px;image-rendering:auto;
    filter:drop-shadow(0 10px 10px rgba(0,0,0,.4));}
  #bomber{left:200px;width:248px;}
  #bomb{left:452px;width:148px;bottom:128px;}
  #enemy{right:404px;width:188px;}
  #bomb2{right:212px;width:140px;bottom:128px;}
  #blast{right:150px;bottom:226px;width:236px;opacity:.96;
    filter:drop-shadow(0 0 28px rgba(255,150,40,.75));}

  /* press start */
  #start{position:absolute;left:50%;bottom:138px;transform:translateX(-50%);
    font-family:'Bungee',cursive;font-size:30px;letter-spacing:.28em;color:#fff;
    text-shadow:0 0 16px rgba(126,217,87,.7), 0 3px 0 #0c1a10;animation:blink 1.15s steps(1) infinite;}
  @keyframes blink{0%,55%{opacity:1;}56%,100%{opacity:.12;}}

  /* footer chips */
  #chips{position:absolute;left:40px;bottom:34px;display:flex;gap:10px;align-items:center;
    font-family:'Segoe UI',system-ui,sans-serif;font-weight:600;font-size:17px;color:rgba(234,244,255,.65);}
  .dot{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.08);}
  #ver{position:absolute;right:42px;bottom:36px;font-family:'Segoe UI',system-ui,sans-serif;font-weight:600;
    font-size:16px;letter-spacing:.1em;color:rgba(234,244,255,.5);}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="lattice"></div>
    <div id="glow"></div>
    <div id="floor"></div>
    <div id="wallrow"></div>

    <img class="sprite" id="bomber" src="sprites/grassland/char_down1.png" alt="" />
    <img class="sprite" id="bomb" src="sprites/grassland/bomb3.png" alt="" />
    <img class="sprite" id="enemy" src="sprites/grassland/enemy1.png" alt="" />
    <img class="sprite" id="bomb2" src="sprites/grassland/bomb2.png" alt="" />
    <img class="sprite" id="blast" src="sprites/grassland/exp_center.png" alt="" />

    <div id="title">
      <div class="word"><span class="blast">BLAST</span><span class="zone">ZONE</span></div>
      <div id="arena">ARENA</div>
    </div>

    <div id="start">PRESS&nbsp;START</div>
    <div id="chips">
      <span class="dot" style="background:#4a8f3c"></span>
      <span class="dot" style="background:#d99b3c"></span>
      <span class="dot" style="background:#5ad1ff"></span>
      &nbsp;3 ARENAS
    </div>
    <div id="ver">v0.1 · OPEN SOURCE</div>
  </div>
</div>
<script>
  // build the bottom wall row
  const wr=document.getElementById('wallrow');
  for(let i=0;i<16;i++){const im=document.createElement('img');im.src='sprites/grassland/wall.png';wr.appendChild(im);}
  // scale stage to fit viewport (contain)
  function fit(){
    const s=document.getElementById('stage');
    const k=Math.min(window.innerWidth/1600, window.innerHeight/900);
    s.style.transform=`scale(${k})`;
  }
  window.addEventListener('resize',fit); fit();
</script>
</body>
</html>
