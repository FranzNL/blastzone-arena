[package]
name = "blastzone-arena"
version = "0.2.0"
edition = "2021"

[dependencies]
bevy = { version = "0.15", features = ["webgl2", "wav"] }
image = { version = "0.25", default-features = false, features = ["png"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "z"
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
